name: Test Sem

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Шаг 1: Скачивание кода моего репозитория
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      # Шаг 2: Установка версии Python

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'  # Укажите версию Pytho

      - name: Install dependencies
        run: |
           python -m pip install --upgrade pip
           pip install -r requirements.txt
      - name: cd and print in parent
        run: |
          pwd
          ls -la
          cd tests
          ls -la
      # 🔍 Отладочный шаг - удалите после нахождения файла
      - name:  Find test file
        run: |
          pwd
          find . -name "*wallett*.py" -o -name "*test*.py"
      - name: 🧪 Run tests
        run: pytest tests/test_wallett.py -v

