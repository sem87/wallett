name: Test Sem

on:
  push:
    branches: [main]

jobs:
  lint:
    name: "Смотрим линт. Все ли хорошо"
    runs-on: ubuntu-latest
    steps:
      # Шаг 1:
      - name: flake8,pylint,black,mypy
        run: echo "смотрим линт"
  test:
    name: "Скачаем зависимости и Запуск тестов"
    runs-on: ubuntu-latest
    needs: lint
    steps:
      # Шаг 1: Скачивание кода моего репозитория
      - name: 📥 Скачивание кода моего
        uses: actions/checkout@v4
      # Шаг 2: Установка версии Python

      - name: 🐍 Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Установим зависимости (requirements.txt)
        run: |
           python -m pip install --upgrade pip
           pip install -r requirements.txt
      - name: смотрим что в папках
        run: |
          pwd
          ls -la
          cd tests
          ls -la
      # 🔍 нахождения файла
      - name:  Find test file
        run: |
          pwd
          find . -name "*wallett*.py" -o -name "*test*.py"
      - name: 🧪 Run tests
        run: pytest tests/test_wallett.py -v
        env:
            PYTHONPATH: ${{ github.workspace }}  # 👈 Добавляем корень репозитория в путь
  build:
    name: "Создаем Докер контейнер"
    runs-on: ubuntu-latest
    needs: test
    steps:
      # Шаг 1: создаем Докер
      - name: создаем Докер
        run: echo "создаем Докер"
  deploy:
    name: "выкладываем на сервер"
    runs-on: ubuntu-latest
    needs: build
    steps:
      # Шаг 1: создаем Докер
      - name: заливаем на сервер
        run: echo "заливаем на сервер"
